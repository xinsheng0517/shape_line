<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="四瓣资源、中心切线与传送带视觉规范">
  <defs>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M 0 0 V 9" stroke="#143047" stroke-width="2"/></pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.1" fill="#713d0b"/></pattern>
    <pattern id="rays" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M 2 14 L 10 2" stroke="#472462" stroke-width="2"/></pattern>
    <g id="trap"><path d="M 38 0 H 98 L 118 120 H 18 Z"/></g>
    <clipPath id="belt-flow-clip"><rect x="-33" y="-10" width="66" height="20"/></clipPath>
    <g id="belt-visual">
      <rect x="-38" y="-23" width="76" height="55" rx="7" fill="#1a1e2a" stroke="#46516a"/>
      <rect x="-33" y="-10" width="66" height="20" fill="#202a3d"/>
      <path d="M -33 -13 H 33 M -33 13 H 33" stroke="#56637e" stroke-width="4"/>
      <g clip-path="url(#belt-flow-clip)" stroke="#a0daff" stroke-width="3">
        <g>
          <path d="M -45 -9 L -37 9 M -29 -9 L -21 9 M -13 -9 L -5 9 M 3 -9 L 11 9 M 19 -9 L 27 9 M 35 -9 L 43 9"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="16 0" dur="0.55s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </defs>
  <rect width="960" height="430" rx="18" fill="#0b0e15"/>
  <text x="30" y="42" fill="#dbe2f1" font-family="system-ui,sans-serif" font-size="23" font-weight="700">四瓣切割与资源标识</text>
  <text x="30" y="63" fill="#8a93a8" font-family="system-ui,sans-serif" font-size="13">横切使用高度中线 y=0.5H；“1/4”表示四瓣槽位，不强制等面积</text>

  <g transform="translate(25 96)">
    <text x="35" y="-10" fill="#dbe2f1" font-family="system-ui,sans-serif" font-size="15">梯形原坯 T</text>
    <use href="#trap" fill="#58a6ff" stroke="#c6e7ff" stroke-width="2"/>
    <use href="#trap" fill="url(#hatch)"/>
    <path d="M 68 0 V 120 M 28 60 H 108" stroke="#fff" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="44" y="151" fill="#8a93a8" font-family="system-ui,sans-serif" font-size="12">纵轴 + 高度中线</text>
  </g>

  <path d="M 195 152 H 248" stroke="#8a93a8" stroke-width="3"/>
  <path d="M 248 152 L 239 147 V 157 Z" fill="#8a93a8"/>
  <text x="205" y="139" fill="#8a93a8" font-family="system-ui,sans-serif" font-size="12">切割</text>

  <g transform="translate(270 95)" stroke="#c6e7ff" stroke-width="2">
    <text x="5" y="1" fill="#dbe2f1" stroke="none" font-family="system-ui,sans-serif" font-size="15">梯形四瓣</text>
    <path d="M 50 12 H 20 L 10 72 H 50 Z" fill="#58a6ff"/>
    <path d="M 50 12 H 20 L 10 72 H 50 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M 60 78 H 20 L 10 138 H 60 Z" fill="#58a6ff"/>
    <path d="M 60 78 H 20 L 10 138 H 60 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M 90 12 H 120 L 130 72 H 90 Z" fill="#58a6ff"/>
    <path d="M 90 12 H 120 L 130 72 H 90 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M 90 78 H 130 L 140 138 H 90 Z" fill="#58a6ff"/>
    <path d="M 90 78 H 130 L 140 138 H 90 Z" fill="url(#hatch)" stroke="none"/>
    <g fill="#dbe2f1" stroke="none" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">
      <text x="32" y="52">TL</text><text x="35" y="117">BL</text>
      <text x="111" y="52">TR</text><text x="111" y="117">BR</text>
    </g>
  </g>

  <g transform="translate(520 95)">
    <text x="16" y="1" fill="#dbe2f1" font-family="system-ui,sans-serif" font-size="15">圆形 C</text>
    <circle cx="55" cy="75" r="58" fill="#f2a93b" stroke="#ffe0a7" stroke-width="2"/>
    <circle cx="55" cy="75" r="58" fill="url(#dots)"/>
    <path d="M 55 17 V 133 M -3 75 H 113" stroke="#fff" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="23" y="155" fill="#8a93a8" font-family="system-ui,sans-serif" font-size="12">点纹与弧线</text>
  </g>

  <g transform="translate(730 95)">
    <text x="30" y="1" fill="#dbe2f1" font-family="system-ui,sans-serif" font-size="15">星形 S</text>
    <path id="star" d="M 65 10 L 82 51 L 125 65 L 82 82 L 65 125 L 48 82 L 5 65 L 48 48 Z" fill="#c586ff" stroke="#ead3ff" stroke-width="2"/>
    <use href="#star" fill="url(#rays)" stroke="none"/>
    <path d="M 65 10 V 125 M 5 65 H 125" stroke="#fff" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="25" y="155" fill="#8a93a8" font-family="system-ui,sans-serif" font-size="12">放射纹与尖角</text>
  </g>

  <path d="M 30 292 H 930" stroke="#2a3042"/>
  <text x="32" y="328" fill="#dbe2f1" font-family="system-ui,sans-serif" font-size="16">传送带：无方向符号；斜纹沿带面滚动，旋转到实际流向</text>
  <use href="#belt-visual" transform="translate(90 360)"/>
  <use href="#belt-visual" transform="translate(270 360) rotate(90)"/>
  <use href="#belt-visual" transform="translate(450 360) rotate(180)"/>
  <use href="#belt-visual" transform="translate(630 360) rotate(270)"/>
  <g fill="#8a93a8" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">
    <text x="90" y="414">右</text><text x="270" y="414">下</text><text x="450" y="414">左</text><text x="630" y="414">上</text>
  </g>
</svg>
